version: '3.8'

services:
  postgres-apikeyd:
    image: docker.io/postgres:16-alpine
    container_name: stoa-postgres-apikeyd
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      POSTGRES_USER: apikeyd
      POSTGRES_PASSWORD: ${APIKEYD_DB_PASSWORD}
      POSTGRES_DB: apikeyd
    volumes:
      - postgres-apikeyd-data:/var/lib/postgresql/data
    networks:
      - postgres-apikeyd-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apikeyd"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-agentd:
    image: docker.io/postgres:16-alpine
    container_name: stoa-postgres-agentd
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: ${AGENTD_DB_PASSWORD}
      POSTGRES_DB: agentd
    volumes:
      - postgres-agentd-data:/var/lib/postgresql/data
    networks:
      - agentd-db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentd"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-authd:
    image: docker.io/postgres:16-alpine
    container_name: stoa-postgres-authd
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      POSTGRES_USER: authd
      POSTGRES_PASSWORD: ${AUTHD_DB_PASSWORD}
      POSTGRES_DB: authd
    volumes:
      - postgres-authd-data:/var/lib/postgresql/data
    networks:
      - postgres-authd-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authd"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-localidp:
    image: docker.io/postgres:16-alpine
    container_name: stoa-postgres-localidp
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      POSTGRES_USER: localidp
      POSTGRES_PASSWORD: ${LOCAL_IDP_DB_PASSWORD}
      POSTGRES_DB: localidp
    volumes:
      - postgres-localidp-data:/var/lib/postgresql/data
    networks:
      - postgres-localidp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localidp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Migrations — one-shot containers, each on its own DB network only
  # ---------------------------------------------------------------------------

  migrate-apikeyd:
    profiles:
      - migrate
    image: apikeyd:local
    build:
      context: .
      target: apikeyd
    container_name: stoa-migrate-apikeyd
    environment:
      APIKEYD_DATABASE_URL: postgres://apikeyd:${APIKEYD_DB_PASSWORD}@postgres-apikeyd:5432/apikeyd?sslmode=disable
    # apikeyd runs its own goose migrations on startup; invoking with -migrate-only
    # exits after migrations complete without starting the HTTP server.
    command: ["-migrate-only"]
    depends_on:
      postgres-apikeyd:
        condition: service_healthy
    networks:
      - postgres-apikeyd-net
    restart: on-failure

  migrate-agentd:
    profiles:
      - migrate
    image: auth-admin:local
    build:
      context: .
      target: auth-admin
    container_name: stoa-migrate-agentd
    environment:
      AGENTD_MIGRATE_DATABASE_URL: postgres://agentd:${AGENTD_DB_PASSWORD}@postgres-agentd:5432/agentd?sslmode=disable
    command: ["agentd", "migrate", "up"]
    depends_on:
      postgres-agentd:
        condition: service_healthy
    networks:
      - agentd-db-net
    restart: on-failure

  migrate-authd:
    profiles:
      - migrate
    image: auth-admin:local
    build:
      context: .
      target: auth-admin
    container_name: stoa-migrate-authd
    environment:
      AUTHD_MIGRATE_DATABASE_URL: postgres://authd:${AUTHD_DB_PASSWORD}@postgres-authd:5432/authd?sslmode=disable
    # ENTRYPOINT is /app/auth-admin; compose command appends args directly.
    command: ["authd", "migrate", "up"]
    depends_on:
      postgres-authd:
        condition: service_healthy
    networks:
      - postgres-authd-net
    restart: on-failure

  migrate-localidp:
    profiles:
      - migrate
    image: auth-admin:local
    build:
      context: .
      target: auth-admin
    container_name: stoa-migrate-localidp
    environment:
      LOCAL_IDP_MIGRATE_DATABASE_URL: postgres://localidp:${LOCAL_IDP_DB_PASSWORD}@postgres-localidp:5432/localidp?sslmode=disable
    command: ["idp", "migrate", "up"]
    depends_on:
      postgres-localidp:
        condition: service_healthy
    networks:
      - postgres-localidp-net
    restart: on-failure

  # ---------------------------------------------------------------------------
  # apikeyd — API key management service
  # Issues and validates stoa-infgw_* keys used by downstream apps to access inference-gateway.
  # Auth flow reuses authd (same OIDC path as webd).
  # ---------------------------------------------------------------------------

  apikeyd:
    image: apikeyd:local
    build:
      context: .
      target: apikeyd
    deploy:
      replicas: 1
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "8889:8889"
    environment:
      APIKEYD_DATABASE_URL: postgres://apikeyd:${APIKEYD_DB_PASSWORD}@postgres-apikeyd:5432/apikeyd?sslmode=disable
      APIKEYD_EXTERNAL_URL: ${APIKEYD_EXTERNAL_URL}
      APIKEYD_AUTHD_URL: http://authd:8888
      APIKEYD_ADMIN_TOKEN: ${APIKEYD_ADMIN_TOKEN}
    volumes:
      - ./config/apikeyd.yaml:/etc/apikeyd/config.yaml:ro
    command: ["-config", "/etc/apikeyd/config.yaml"]
    depends_on:
      postgres-apikeyd:
        condition: service_healthy
      authd:
        condition: service_healthy
    networks:
      - postgres-apikeyd-net
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8889/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # presidio-analyzer — Microsoft Presidio NLP PII detection service
  # Reachable only by pii-filter (pii-net). No external exposure.
  # ---------------------------------------------------------------------------

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    container_name: stoa-presidio-analyzer
    mem_limit: 1g
    memswap_limit: 1g
    networks:
      - pii-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 2m

  # ---------------------------------------------------------------------------
  # pii-filter — Presidio webhook sidecar for inference-gateway
  # Anonymizes inbound messages (pre-request) and de-anonymizes LLM responses
  # (response-transform) using Presidio. Reachable only via pii-net.
  # ---------------------------------------------------------------------------

  pii-filter:
    image: pii-filter:local
    build:
      context: .
      target: pii-filter
    container_name: stoa-pii-filter
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      PII_LISTEN: ":3100"
      PII_PRESIDIO_URL: "http://presidio-analyzer:3000"
      PII_LANGUAGE: "en"
      PII_SCORE_THRESHOLD: "0.5"
      # PII_ENTITIES: "PERSON,EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD,IBAN_CODE,IP_ADDRESS,LOCATION"
      PII_TTL_SECONDS: "300"
      PII_SKIP_SYSTEM_MSGS: "false"
    depends_on:
      presidio-analyzer:
        condition: service_started
    networks:
      - pii-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # inference-gateway — bidirectional LLM API proxy (OpenAI / Anthropic / Gemini)
  # Validates inbound API keys via apikeyd; forwards to configured upstreams.
  # ---------------------------------------------------------------------------

  inference-gateway:
    image: inference-gateway:local
    build:
      context: .
      target: inference-gateway
    container_name: stoa-inference-gateway
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "8080:8080"
    environment:
      VENICE_API_KEY_FILE: /run/secrets/venice_api_key
      ARCEE_API_KEY_FILE: /run/secrets/arcee_api_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - venice_api_key
      - arcee_api_key
      - openrouter_api_key
    volumes:
      - ./config/inference-gateway.yaml:/etc/inference-gateway/config.yaml:ro
    command: ["-config", "/etc/inference-gateway/config.yaml"]
    depends_on:
      apikeyd:
        condition: service_healthy
      pii-filter:
        condition: service_healthy
    networks:
      - agent-external
      - pii-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # local-idp — credential store and OIDC server
  # Reachable only by authd (via idp-net). No internet path. No agent path.
  # ---------------------------------------------------------------------------

  local-idp:
    image: local-idp:local
    build:
      context: .
      target: local-idp
    container_name: stoa-local-idp
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      LOCAL_IDP_DATABASE_URL: postgres://localidp:${LOCAL_IDP_DB_PASSWORD}@postgres-localidp:5432/localidp?sslmode=disable
      LOCAL_IDP_ISSUER: ${LOCAL_IDP_ISSUER}
      LOCAL_IDP_EXTERNAL_URL: ${LOCAL_IDP_EXTERNAL_URL}
      LOCAL_IDP_CLIENT_ID: stoa
      LOCAL_IDP_REDIRECT_URIS: ${LOCAL_IDP_REDIRECT_URIS}
      AUTHD_OAUTH_LOCAL_CLIENT_SECRET: ${AUTHD_OAUTH_LOCAL_CLIENT_SECRET}
    ports:
      - "9999:9999"
    depends_on:
      postgres-localidp:
        condition: service_healthy
    networks:
      - postgres-localidp-net
      - idp-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # authd — OAuth2 identity broker
  # Reachable by agentd + zulip-bridge (agent-external) and local-idp (idp-net).
  # Has its own DB path (postgres-authd-net). No path to local-idp's DB.
  # ---------------------------------------------------------------------------

  authd:
    image: authd:local
    build:
      context: .
      target: authd
    deploy:
      replicas: 1
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "8888:8888"
    environment:
      AUTHD_DATABASE_URL: postgres://authd:${AUTHD_DB_PASSWORD}@postgres-authd:5432/authd?sslmode=disable
      AUTHD_EXTERNAL_URL: ${AUTHD_EXTERNAL_URL}
      AUTHD_ADMIN_TOKEN: ${AUTHD_ADMIN_TOKEN}
      AUTHD_CONFIG: /etc/authd/config.yaml
      AUTHD_OAUTH_LOCAL_CLIENT_SECRET: ${AUTHD_OAUTH_LOCAL_CLIENT_SECRET}
      AUTHD_ALLOWED_REDIRECT_ORIGINS: ${AUTHD_ALLOWED_REDIRECT_ORIGINS}
      # Per-user LLM key provisioning at login (best-effort — login succeeds if apikeyd is down).
      AUTHD_APIKEYD_URL: http://apikeyd:8889
      AUTHD_APIKEYD_ADMIN_TOKEN: ${APIKEYD_ADMIN_TOKEN}
    volumes:
      - ./config/authd.yaml:/etc/authd/config.yaml:ro
    depends_on:
      postgres-authd:
        condition: service_healthy
      local-idp:
        condition: service_healthy
    networks:
      - postgres-authd-net
      - idp-net
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    image: docker.io/nginx:1.30.0-alpine
    container_name: stoa-nginx
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "8090:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agentd:
        condition: service_healthy
      webd:
        condition: service_started
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  agentd:
    image: agentd:local
    build:
      context: .
      target: agentd
    deploy:
      replicas: 1
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      # LLM provider — env var names here match api_key_env/api_url_env in config YAML.
      # The podman secret name (e.g. anthropic_api_key) is decoupled from the env var
      # name (e.g. GATEWAY_API_KEY_FILE); you can rename one without touching the other.
      LLM_PROVIDER: ${LLM_PROVIDER}
      GATEWAY_API_KEY_FILE: /run/secrets/gateway_api_key
      GATEWAY_API_URL: ${GATEWAY_API_URL}

      # Conversation titling
      TITLING_ENABLED: ${TITLING_ENABLED}
      TITLING_PROVIDER: ${TITLING_PROVIDER}
      TITLING_MODEL: ${TITLING_MODEL}

      # MCP server credentials
      NETBOX_BASE_URL: ${NETBOX_BASE_URL}
      NETBOX_TOKEN: ${NETBOX_TOKEN}
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL}
      GRAPHQL_ENDPOINT: ${GRAPHQL_ENDPOINT}
      ZULIP_MCP_BASE_URL: ${ZULIP_MCP_BASE_URL}
      ZULIP_MCP_EMAIL: ${ZULIP_MCP_EMAIL}
      ZULIP_MCP_API_KEY: ${ZULIP_MCP_API_KEY}
      TRELLO_API_KEY: ${TRELLO_API_KEY}
      TRELLO_TOKEN: ${TRELLO_TOKEN}
      TRELLO_BOARDS: ${TRELLO_BOARDS}

      # Podman socket
      DOCKER_HOST: unix:///run/podman/podman.sock

      # Auth — delegate token validation to authd
      AGENTD_AUTHD_URL: http://authd:8888

      # Session database
      AGENTD_DATABASE_URL: postgres://agentd:${AGENTD_DB_PASSWORD}@postgres-agentd:5432/agentd?sslmode=disable

      # Session persistence
      AGENTD_SESSION_DIR: /app/sessions

      # Attachment secret and S3 credentials — passed through to mcp-attachments containers.
      ATTACHMENT_SECRET: ${ATTACHMENT_SECRET}
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      GARAGE_S3_BUCKET: ${GARAGE_BUCKET}
      GARAGE_S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      GARAGE_S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}

      # Squid proxy
      AGENTD_SQUID_CONF_PATH: /app/squid/squid.conf
      MCP_PROXY_ADDRESS: "http://stoa-squid:3128"
    volumes:
      - ./config:/etc/stoa:ro
      - ./skills:/app/skills:ro
      - ./data/traces:/app/traces
      - ./data/logs:/app/logs
      - ./data/sessions:/app/sessions
      - ./data/squid:/app/squid
      - mcp-workspace:/tmp/mcp-workspace
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:ro
    depends_on:
      authd:
        condition: service_healthy
      postgres-agentd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7777/acp/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    secrets:
      - gateway_api_key
    networks:
      - agent-external
      - agentd-db-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges:true

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    container_name: stoa-garage
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    networks:
      - agent-external
    restart: unless-stopped

  garage-init:
    profiles:
      - disabled
    image: garage-init:local
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    mem_limit: 128m
    memswap_limit: 128m
    container_name: stoa-garage-init
    volumes:
      - ./scripts/garage-init.sh:/garage-init.sh:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    networks:
      - agent-external
    restart: on-failure
    depends_on:
      - garage

  webd:
    image: webd:local
    build:
      context: .
      target: webd
    deploy:
      replicas: 1
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      WEBD_EXTERNAL_URL: ${WEBD_EXTERNAL_URL}
      WEBD_AUTHD_URL: http://authd:8888
      WEBD_AGENTD_URL: http://agentd:7777
      WEBD_APIKEYD_URL: http://apikeyd:8889
      WEBD_S3_ENDPOINT: http://garage:3900
      WEBD_S3_REGION: garage
      WEBD_S3_BUCKET: ${GARAGE_BUCKET}
      WEBD_S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID}
      WEBD_S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY}
      ATTACHMENT_SECRET: ${ATTACHMENT_SECRET}
    depends_on:
      authd:
        condition: service_healthy
      agentd:
        condition: service_healthy
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  chat:
    profiles: [chat]
    image: chat:local
    build:
      context: .
      target: chat
    container_name: stoa-chat
    environment:
      AGENT_ADDRESS: http://agentd:7777
    volumes:
      - ./config:/etc/stoa:ro
      - ./data/traces:/app/traces
      - ./data/logs:/app/logs
    depends_on:
      - agentd
    networks:
      - agent-external
    stdin_open: true
    tty: true
    restart: unless-stopped
    security_opt:
      - label=disable

  zulip-bridge:
    profiles:
      - disabled
    image: zulip-bridge:local
    build:
      context: .
      target: zulip-bridge
    container_name: stoa-zulip-bridge
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      AGENT_ADDRESS: http://agentd:7777

      # Service account token for authenticating to agentd.
      # Generate with: docker compose run --rm migrate-authd \
      #   /app/auth-admin authd service create zulip-bridge
      AGENTD_API_KEY: ${ZULIP_BRIDGE_SERVICE_TOKEN}
      # authd URL for Zulip account linking — reuses the service token above.
      AGENTD_AUTHD_URL: http://authd:8888

      ZULIP_SESSION_FILE: /app/logs/zulip-sessions.json
      ZULIP_ENABLED: ${ZULIP_ENABLED}
      ZULIP_SITE_URL: ${ZULIP_SITE_URL}
      ZULIP_EMAIL: ${ZULIP_EMAIL}
      ZULIP_API_KEY: ${ZULIP_API_KEY}
    volumes:
      - ./config:/etc/stoa:ro
      - ./data/logs:/app/logs
      - mcp-workspace:/tmp/mcp-workspace
    depends_on:
      - agentd
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges:true

  slack-bridge:
    profiles:
      - disabled
    image: slack-bridge:local
    build:
      context: .
      target: slack-bridge
    container_name: stoa-slack-bridge
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      AGENT_ADDRESS: http://agentd:7777

      # Service account token for authenticating to agentd.
      # Generate with: docker compose run --rm migrate-authd \
      #   /app/auth-admin authd service create slack-bridge
      AGENTD_API_KEY: ${SLACK_BRIDGE_SERVICE_TOKEN}
      # authd URL for Slack account linking — reuses the service token above.
      AGENTD_AUTHD_URL: http://authd:8888

      SLACK_SESSION_FILE: /app/logs/slack-sessions.json
      SLACK_ENABLED: ${SLACK_ENABLED}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
    volumes:
      - ./config:/etc/stoa:ro
      - ./data/logs:/app/logs
    depends_on:
      - agentd
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges:true

  discord-bridge:
    profiles:
      - disabled
    image: discord-bridge:local
    build:
      context: .
      target: discord-bridge
    container_name: stoa-discord-bridge
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      AGENT_ADDRESS: http://agentd:7777

      # Service account token for authenticating to agentd.
      # Generate with: docker compose run --rm migrate-authd \
      #   /app/auth-admin authd service create discord-bridge
      AGENTD_API_KEY: ${DISCORD_BRIDGE_SERVICE_TOKEN}
      # authd URL for Discord account linking — reuses the service token above.
      AGENTD_AUTHD_URL: http://authd:8888

      DISCORD_SESSION_FILE: /app/logs/discord-sessions.json
      DISCORD_ENABLED: ${DISCORD_ENABLED}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    volumes:
      - ./config:/etc/stoa:ro
      - ./data/logs:/app/logs
    depends_on:
      - agentd
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges:true

  matrix-bridge:
    profiles:
      - disabled
    image: matrix-bridge:local
    build:
      context: .
      target: matrix-bridge
    container_name: stoa-matrix-bridge
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      AGENT_ADDRESS: http://agentd:7777

      # Service account token for authenticating to agentd.
      # Generate with: docker compose run --rm migrate-authd \
      #   /app/auth-admin authd service create matrix-bridge
      AGENTD_API_KEY: ${MATRIX_BRIDGE_SERVICE_TOKEN}
      # authd URL for Matrix account linking — reuses the service token above.
      AGENTD_AUTHD_URL: http://authd:8888

      MATRIX_SESSION_FILE: /app/logs/matrix-sessions.json
      MATRIX_ENABLED: ${MATRIX_ENABLED:-false}
      MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL}
      MATRIX_USERNAME: ${MATRIX_USERNAME}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD}
    volumes:
      - ./config:/etc/stoa:ro
      - ./data/logs:/app/logs
    depends_on:
      - agentd
    networks:
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - label=disable
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # prometheus — metrics collection
  # On monitoring-net (internal) for Grafana, and agent-external to scrape services.
  # ---------------------------------------------------------------------------

  prometheus:
    image: docker.io/prom/prometheus:v3
    container_name: stoa-prometheus
    user: "65534:65534"
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
      - agent-external
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # loki — log aggregation backend
  # Receives logs from Promtail; queried by Grafana via the Loki datasource.
  # ---------------------------------------------------------------------------

  loki:
    image: docker.io/grafana/loki:3.4.4
    container_name: stoa-loki
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    networks:
      - monitoring-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ---------------------------------------------------------------------------
  # promtail — log shipper
  # Scrapes container logs via the Podman socket and forwards them to Loki.
  # ---------------------------------------------------------------------------

  promtail:
    image: docker.io/grafana/promtail:3.4.4
    container_name: stoa-promtail
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - ./config/promtail.yaml:/etc/promtail/config.yaml:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:ro
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: unless-stopped
    security_opt:
      - label=disable
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # grafana — metrics visualization
  # Port 3000 exposed. Prometheus auto-provisioned as default datasource.
  # GRAFANA_ADMIN_PASSWORD must be set in .env.
  # ---------------------------------------------------------------------------

  grafana:
    image: docker.io/grafana/grafana:13.1.0-25351545110
    container_name: stoa-grafana
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  squid:
    image: docker.io/ubuntu/squid:6.6-24.04_beta
    container_name: stoa-squid
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./data/squid/squid.conf:/etc/squid/squid.conf:ro
      - squid-cache:/var/spool/squid
    networks:
      - mcp-shell-net
      - mcp-netbox-net
      - mcp-zulip-net
      - mcp-prometheus-net
      - mcp-graphql-net
      - agent-external
    restart: always
    security_opt:
      - label=disable

networks:

  # -- Agent session DB network (internal — no internet route) --------------

  agentd-db-net:
    driver: bridge
    name: agentd-db-net
    internal: true

  # -- apikeyd DB network (internal — no internet route) --------------------

  postgres-apikeyd-net:
    driver: bridge
    name: postgres-apikeyd-net
    internal: true

  # -- Auth DB networks (internal — no internet route) -----------------------

  postgres-authd-net:
    driver: bridge
    name: postgres-authd-net
    internal: true

  postgres-localidp-net:
    driver: bridge
    name: postgres-localidp-net
    internal: true

  # -- Service-to-service (internal — no internet route) --------------------

  # authd → local-idp OIDC calls only. local-idp has no other external path.
  idp-net:
    driver: bridge
    name: idp-net
    internal: true

  # -- PII filter network (internal — inference-gateway ↔ pii-filter ↔ presidio) --

  pii-net:
    driver: bridge
    name: pii-net
    internal: true

  # -- External-facing ------------------------------------------------------

  # agentd, authd, zulip-bridge, chat, squid. Has internet egress.
  agent-external:
    driver: bridge
    name: agent-external

  # -- MCP container networks (internal — traffic must go through squid) ----

  mcp-shell-net:
    driver: bridge
    name: mcp-shell-net
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24

  mcp-netbox-net:
    driver: bridge
    name: mcp-netbox-net
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24

  mcp-zulip-net:
    driver: bridge
    name: mcp-zulip-net
    internal: true
    ipam:
      config:
        - subnet: 172.28.4.0/24

  mcp-prometheus-net:
    driver: bridge
    name: mcp-prometheus-net
    internal: true
    ipam:
      config:
        - subnet: 172.28.5.0/24

  mcp-graphql-net:
    driver: bridge
    name: mcp-graphql-net
    internal: true
    ipam:
      config:
        - subnet: 172.28.6.0/24

  # -- Monitoring (internal — Grafana ↔ Prometheus) -------------------------

  monitoring-net:
    driver: bridge
    name: monitoring-net
    internal: true

secrets:
  anthropic_api_key:
    external: true
  gateway_api_key:
    external: true
  openai_api_key:
    external: true
  gemini_api_key:
    external: true
  arcee_api_key:
    external: true
  openrouter_api_key:
    external: true
  venice_api_key:
    external: true

volumes:
  postgres-apikeyd-data:
  postgres-agentd-data:
  postgres-authd-data:
  postgres-localidp-data:
  mcp-memory-data:
  mcp-workspace:
  mcp-shell-workspace:
  squid-cache:
  garage-meta:
  garage-data:
  prometheus-data:
  loki-data:
  grafana-data:
