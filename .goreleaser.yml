    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - {goos: windows, goarch: arm64}
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/stanier/stoa/internal/version.Version={{.Version}}

