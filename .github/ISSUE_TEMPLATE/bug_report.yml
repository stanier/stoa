name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Stoa is affected?
      options:
        - agentd (daemon)
        - chat (TUI)
        - webd (web UI)
        - Auth (authd / local-idp)
        - Bridge (Zulip / Slack / Discord / Matrix)
        - MCP server
        - Inference gateway
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start agentd with ...
        2. Send message ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config / logs
      description: Paste any relevant config snippets or log output. Redact API keys.
      render: yaml

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main@a8bdec9, or output of `git rev-parse --short HEAD`
    validations:
      required: false
