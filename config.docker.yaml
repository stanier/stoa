# Example configuration for Stoa with Docker-based MCP servers
# This config demonstrates how to run MCP servers in containers

llm:
  provider: anthropic  # or openai
  model: claude-sonnet-4-5-20250929
  max_tokens: 8000

ui:
  theme: dark
  show_timestamps: true
  hide_system_prompt: false
  persona: coder

mcp:
  enabled: true
  servers:
    # Filesystem server running in Docker container
    - name: filesystem
      transport: docker
      image: ghcr.io/stanier/stoa-mcp-filesystem:latest
      network_mode: mcp-bridge
      volumes:
        # Bind mount: host directory to container
        - type: bind
          source: /tmp/mcp-workspace
          target: /mcp/root
          read_only: false
      args:
        - -root
        - /mcp/root
      policies:
        - tool_pattern: "mcp_filesystem_read_*"
          rank: 1  # Mention
          reason: "File reads are visible but don't require approval"
        - tool_pattern: "mcp_filesystem_write_*"
          rank: 2  # Request
          reason: "File writes require explicit approval"

    # Memory server with persistent volume
    - name: agent-memory
      transport: docker
      image: ghcr.io/stanier/stoa-mcp-memory:latest
      network_mode: mcp-bridge
      volumes:
        # Named volume: persists data across container restarts
        - type: volume
          source: mcp-memory-data
          target: /data
          read_only: false
      env:
        MEMORY_DB_PATH: /data/memory.db
      policies:
        - tool_pattern: "mcp_agent-memory_*"
          rank: 0  # Silent
          reason: "Memory operations are safe and non-destructive"

    # Time server (stateless, no volumes needed)
    - name: time
      transport: docker
      image: ghcr.io/stanier/stoa-mcp-time:latest
      network_mode: mcp-bridge
      env:
        TZ: America/New_York
      policies:
        - tool_pattern: "mcp_time_*"
          rank: 0  # Silent
          reason: "Time operations are read-only"

    # Fetch server for HTTP/REST requests
    - name: fetch
      transport: docker
      image: ghcr.io/stanier/stoa-mcp-fetch:latest
      network_mode: mcp-bridge
      policies:
        - tool_pattern: "mcp_fetch_get"
          rank: 1  # Mention
          reason: "HTTP GET requests should be visible"
        - tool_pattern: "mcp_fetch_post"
          rank: 2  # Request
          reason: "HTTP POST requests require approval"

    # Diff server for text comparison
    - name: diff
      transport: docker
      image: ghcr.io/stanier/stoa-mcp-diff:latest
      network_mode: mcp-bridge
      policies:
        - tool_pattern: "mcp_diff_*"
          rank: 0  # Silent
          reason: "Diff operations are safe and non-destructive"

    # Example: stdio transport for local development (faster iteration)
    # - name: filesystem-local
    #   transport: stdio
    #   command: ./bin/debug/mcp-filesystem
    #   args:
    #     - -root
    #     - /tmp/workspace
    #   policies:
    #     - tool_pattern: "mcp_filesystem-local_*"
    #       rank: 1

compaction:
  enabled: true
  max_tokens: 100000
  compact_threshold: 90000
  strategy: summarize
  keep_recent: 5

agents:
  enabled: true
  max_concurrent: 3
  share_context: false

logging:
  level: info
  log_file: /app/logs/app.log

trace:
  enabled: true
  dir: /app/traces

permissions:
  default_rank: 2  # Request by default
  audit_log: true
  audit_log_path: /app/logs/audit.log

prompts:
  override_dir: /app/prompts  # Optional: custom prompts directory
